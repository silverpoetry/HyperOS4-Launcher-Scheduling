<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f2fa" />
    <link rel="stylesheet" href="https://mui.kernelsu.org/internal/insets.css" />
    <link rel="stylesheet" href="https://mui.kernelsu.org/internal/colors.css" />
    <link rel="stylesheet" href="./styles.css" />
    <title>Launcher Scheduling</title>
  </head>
  <body>
    <div class="app-root">
      <header class="top-bar">
        <div>
          <h1>Launcher Scheduling</h1>
          <span id="versionText">—</span>
        </div>
        <div class="top-actions">
          <span class="service-state" id="serviceState"><i></i><b>读取中</b></span>
          <button class="icon-button" id="refreshButton" type="button" aria-label="刷新">↻</button>
        </div>
      </header>

      <main class="page-shell" id="swipeShell">
        <div class="page-track" id="pageTrack">
          <section class="page" data-page="status">
            <div class="page-content">
              <section class="panel status-list">
                <div class="data-row"><span>状态</span><strong id="policyValue">—</strong></div>
                <div class="data-row"><span>阶段</span><strong id="modeValue">—</strong></div>
                <div class="data-row"><span>守护进程</span><strong id="daemonValue">—</strong></div>
                <div class="data-row"><span>Launcher PID</span><strong id="launcherPidValue">—</strong></div>
                <div class="data-row"><span>转场序号</span><strong id="serialValue">—</strong></div>
              </section>

              <h2>来源应用</h2>
              <section class="panel status-list">
                <div class="data-row"><span>进程</span><strong id="sourceValue">—</strong></div>
                <div class="data-row"><span>PID / UID</span><strong id="sourcePidValue">—</strong></div>
                <div class="data-row"><span>CPU</span><strong id="sourceCpuValue">—</strong></div>
                <div class="data-row"><span>cpuset</span><strong id="sourceGroupValue">—</strong></div>
              </section>

              <h2>小核频率</h2>
              <section class="panel status-list">
                <div class="data-row"><span>Policy</span><strong id="freqPolicyValue">—</strong></div>
                <div class="data-row"><span>CPU</span><strong id="freqCpuValue">—</strong></div>
                <div class="data-row"><span>当前上限</span><strong id="freqCurrentValue">—</strong></div>
                <div class="data-row"><span>硬件上限</span><strong id="freqMaxValue">—</strong></div>
                <div class="data-row"><span>限频活动</span><strong id="freqActiveValue">—</strong></div>
              </section>

              <h2>CPU 集合</h2>
              <section class="mask-grid">
                <div><span>全部</span><strong id="allMask">—</strong><small id="allList">—</small></div>
                <div><span>性能</span><strong id="perfMask">—</strong><small id="perfList">—</small></div>
                <div><span>中核</span><strong id="midMask">—</strong><small id="midList">—</small></div>
                <div><span>小核</span><strong id="littleMask">—</strong><small id="littleList">—</small></div>
              </section>

              <section class="panel status-list device-block">
                <div class="data-row"><span>设备</span><strong id="deviceValue">—</strong></div>
                <div class="data-row"><span>系统</span><strong id="osValue">—</strong></div>
                <div class="data-row"><span>内核</span><strong id="kernelValue">—</strong></div>
                <div class="data-row"><span>SELinux</span><strong id="selinuxValue">—</strong></div>
                <div class="data-row"><span>作者</span><strong>github: silverpoetry</strong></div>
              </section>
            </div>
          </section>

          <section class="page" data-page="settings">
            <div class="page-content">
              <h2>开关</h2>
              <section class="panel switch-list">
                <label><span>模块策略<small>总开关</small></span><input id="policyToggle" type="checkbox" /></label>
                <label><span>来源应用退避<small>affinity + background cgroup</small></span><input id="sourceToggle" type="checkbox" /></label>
                <label><span>壁纸与 MIMD<small>background cgroup</small></span><input id="auxToggle" type="checkbox" /></label>
                <label><span>Launcher 线程<small>affinity + uclamp</small></span><input id="threadToggle" type="checkbox" /></label>
                <label><span>小核限频<small>转场期间，默认关闭</small></span><input id="frequencyToggle" type="checkbox" /></label>
              </section>

              <h2>小核限频</h2>
              <section class="panel input-grid">
                <label><span>上限比例</span><div><input id="frequencyPercent" type="number" min="40" max="100" step="1" /><em>%</em></div></label>
                <label><span>超时恢复</span><div><input id="frequencyTimeout" type="number" min="300" max="5000" step="100" /><em>ms</em></div></label>
              </section>

              <h2>Launcher 线程</h2>
              <section class="panel input-grid">
                <label class="wide"><span>UI / Rust 放置</span><select id="launcherPlacement"><option value="2">中核集合</option><option value="1">性能集合</option></select></label>
                <label class="wide"><span>FenceWait 放置</span><select id="fencePlacement"><option value="2">中核集合</option><option value="1">小核集合</option></select></label>
                <label><span>提升持续</span><div><input id="boostDuration" type="number" min="1" max="1000" step="1" /><em>ms</em></div></label>
                <label><span>Raster min</span><input id="uclampRaster" type="number" min="0" max="1024" step="16" /></label>
                <label><span>UI min</span><input id="uclampUi" type="number" min="0" max="1024" step="16" /></label>
                <label><span>Rust min</span><input id="uclampRust" type="number" min="0" max="1024" step="16" /></label>
                <label><span>ResMgr min</span><input id="uclampResmgr" type="number" min="0" max="1024" step="16" /></label>
              </section>

              <h2>转场</h2>
              <section class="panel input-grid">
                <label><span>返回事件兜底</span><div><input id="appFallback" type="number" min="500" max="5000" step="100" /><em>ms</em></div></label>
              </section>

              <button class="primary-button" id="saveButton" type="button">保存并重载</button>
            </div>
          </section>

          <section class="page" data-page="diagnostics">
            <div class="page-content">
              <div class="section-title"><h2>Launcher 线程</h2><button id="threadRefreshButton" type="button">刷新</button></div>
              <section class="panel thread-table" id="threadTable"><p>—</p></section>

              <div class="section-title"><h2>事件日志</h2><button id="logRefreshButton" type="button">刷新</button></div>
              <pre class="log-output" id="logOutput">—</pre>
              <div class="button-row">
                <button id="copyButton" type="button">复制诊断</button>
                <button id="clearLogButton" type="button">清空日志</button>
                <button id="restartButton" type="button">重载服务</button>
              </div>
            </div>
          </section>
        </div>
      </main>

      <nav class="bottom-nav">
        <button class="nav-item active" data-index="0" type="button"><b>●</b><span>状态</span></button>
        <button class="nav-item" data-index="1" type="button"><b>≡</b><span>设置</span></button>
        <button class="nav-item" data-index="2" type="button"><b>&gt;_</b><span>日志</span></button>
      </nav>

      <div class="snackbar" id="snackbar"><span></span></div>
      <div class="busy" id="busy"><i></i><span>处理中</span></div>
    </div>
    <script src="./app.js" defer></script>
  </body>
</html>
